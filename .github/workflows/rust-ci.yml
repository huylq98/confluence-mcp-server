name: Rust CI

on:
  push:
    branches: [master, rust-port]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Fetch UPX
        run: |
          Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-win64.zip" -OutFile "$env:TEMP\upx.zip"
          Expand-Archive -Path "$env:TEMP\upx.zip" -DestinationPath "${{ github.workspace }}/tools" -Force
        working-directory: .

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace -- --test-threads=1

      - name: Build distribution
        run: powershell -ExecutionPolicy Bypass -File scripts/build.ps1
        working-directory: ${{ github.workspace }}

      - name: Enforce size gates
        run: |
          $server = (Get-Item "target/release/confluence-mcp-server.exe").Length
          $wizard = (Get-Item "dist/ConfluenceConnect.exe").Length
          Write-Host ("server: {0:N0} bytes ({1:N2} MB)" -f $server, ($server / 1MB))
          Write-Host ("wizard: {0:N0} bytes ({1:N2} MB)" -f $wizard, ($wizard / 1MB))
          if ($server -gt 6MB) { Write-Error "server exceeds 6 MB ceiling"; exit 1 }
          if ($wizard -gt 12MB) { Write-Error "wizard exceeds 12 MB ceiling"; exit 1 }
        working-directory: ${{ github.workspace }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConfluenceConnect
          path: dist/ConfluenceConnect.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build server binary
        run: cargo build --release -p server

      - name: Copy server binary into configurator resources
        run: |
          mkdir -p crates/configurator/resources
          cp target/release/confluence-mcp-server crates/configurator/resources/confluence-mcp-server

      - name: Generate icon.icns
        run: |
          sips -s format png crates/configurator/icons/icon.ico --out /tmp/app_icon.png
          mkdir /tmp/icon.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size /tmp/app_icon.png \
              --out /tmp/icon.iconset/icon_${size}x${size}.png
            sips -z $((size * 2)) $((size * 2)) /tmp/app_icon.png \
              --out /tmp/icon.iconset/icon_${size}x${size}@2x.png
          done
          iconutil -c icns /tmp/icon.iconset -o crates/configurator/icons/icon.icns

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace -- --test-threads=1
