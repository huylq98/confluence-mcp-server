[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "confluence-mcp-server"
version = "0.1.0"
description = "MCP server connecting Claude to Confluence Server / Data Center"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]
gui = [
    "pywebview>=5.0",
]

[project.scripts]
confluence-mcp = "server:main"

[tool.setuptools]
py-modules = ["server", "config", "confluence_client", "main", "build"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
